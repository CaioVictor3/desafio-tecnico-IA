[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "emporio-ai-agent"
version = "0.1.0"
description = "Agente da Empório da Música com OpenAI e consultas exclusivas aos CSVs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
emporio = "emporio.interface_linha_de_comando:main"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

